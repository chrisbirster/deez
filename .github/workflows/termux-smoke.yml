name: termux-smoke

on:
  pull_request:
    paths:
      - build.zig
      - VERSION
      - scripts/build-termux-release.sh
      - scripts/patch-zig-android-dns.py
      - .github/workflows/termux-smoke.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_API_LEVEL: "24"

jobs:
  termux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android NDK
        run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file unzip openssl binutils
      - name: Build Android/Bionic ARM64 binary
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: ./scripts/build-termux-release.sh
      - name: Verify Google Play Termux ELF contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(readelf -h zig-out/bin/deez | awk '/Type:/{print $2}')" = "DYN"
          readelf -l zig-out/bin/deez | grep -q '/system/bin/linker64'
          readelf -d zig-out/bin/deez | grep -q 'Shared library: \[libc.so\]'
          readelf -Ws zig-out/bin/deez | grep -Eq 'UND.*getaddrinfo'
