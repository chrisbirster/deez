name: termux-smoke

on:
  pull_request:
    paths:
      - build.zig
      - scripts/build-termux-release.sh
      - .github/workflows/termux-smoke.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  termux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install ARM64 smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file qemu-user-static unzip openssl
      - name: Build Termux-compatible ARM64 binary
        run: ./scripts/build-termux-release.sh
      - name: Verify CLI and SQLite under ARM64 QEMU
        shell: bash
        run: |
          set -euo pipefail
          qemu-aarch64-static ./zig-out/bin/deez --help >/dev/null

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          DEEZ_STORAGE=sqlite DEEZ_DB="$tmp/deez.db" \
            qemu-aarch64-static ./zig-out/bin/deez decks >/dev/null
