name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format diagnostic copy
        run: |
          zig fmt build.zig src
          git diff -- src/fsrs/v7/parity_tests.zig src/fsrs/v7/scheduler_parity_tests.zig || true
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
