name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          if ! zig fmt --check build.zig src test; then
            zig fmt build.zig src test
            echo 'zig fmt produced the following diff:'
            git --no-pager diff -- build.zig src test
            exit 1
          fi
      - name: Build
        run: zig build
      - name: Local Web API smoke
        shell: bash
        run: bash test/web_smoke.sh
      - name: First-run and shareable deck smoke
        shell: bash
        run: |
          set -euo pipefail

          first_home=$(mktemp -d)
          HOME="$first_home" ./zig-out/bin/deez --help >/dev/null
          test ! -e "$first_home/.config/deez/config"

          HOME="$first_home" ./zig-out/bin/deez decks </dev/null
          test -f "$first_home/.local/share/deez/deez.db"
          test -f "$first_home/.config/deez/config"
          test "$(head -n 1 "$first_home/.config/deez/config")" = "sqlite"

          HOME="$first_home" ./zig-out/bin/deez deck add "Zig Basics"
          HOME="$first_home" ./zig-out/bin/deez card add 1 "What is Zig?" "A systems programming language"
          HOME="$first_home" ./zig-out/bin/deez nuts | grep -q "Zig Basics"

          HOME="$first_home" ./zig-out/bin/deez deck export 1 > /tmp/zig-basics.json
          grep -q '"format": "deez.deck"' /tmp/zig-basics.json
          grep -q '"version": 2' /tmp/zig-basics.json
          grep -q '"name": "Zig Basics"' /tmp/zig-basics.json
          grep -q '"note_type": "basic"' /tmp/zig-basics.json

          HOME="$first_home" ./zig-out/bin/deez nut export 1 > /tmp/zig-basics.nut
          test "$(wc -l < /tmp/zig-basics.nut | tr -d ' ')" = "2"
          head -n 1 /tmp/zig-basics.nut | grep -q '"kind":"deck"'
          head -n 1 /tmp/zig-basics.nut | grep -q '"format":"deez.nut"'
          head -n 1 /tmp/zig-basics.nut | grep -q '"version":2'
          tail -n 1 /tmp/zig-basics.nut | grep -q '"kind":"note"'
          tail -n 1 /tmp/zig-basics.nut | grep -q '"note_type":"basic"'

          second_home=$(mktemp -d)
          HOME="$second_home" ./zig-out/bin/deez deck import /tmp/zig-basics.json </dev/null
          HOME="$second_home" ./zig-out/bin/deez decks | grep -q "Zig Basics"
          HOME="$second_home" ./zig-out/bin/deez cards 1 | grep -q "What is Zig?"

          third_home=$(mktemp -d)
          HOME="$third_home" ./zig-out/bin/deez nut import /tmp/zig-basics.nut </dev/null
          HOME="$third_home" ./zig-out/bin/deez nuts | grep -q "Zig Basics"
          HOME="$third_home" ./zig-out/bin/deez cards 1 | grep -q "What is Zig?"

          fourth_home=$(mktemp -d)
          HOME="$fourth_home" ./zig-out/bin/deez deck import /tmp/zig-basics.nut </dev/null
          HOME="$fourth_home" ./zig-out/bin/deez decks | grep -q "Zig Basics"

          rich_home=$(mktemp -d)
          HOME="$rich_home" ./zig-out/bin/deez deck add "Geography" </dev/null
          HOME="$rich_home" ./zig-out/bin/deez note add 1 reverse "France" "Paris"
          HOME="$rich_home" ./zig-out/bin/deez notes 1 | grep -q "basic-reverse"
          test "$(HOME="$rich_home" ./zig-out/bin/deez cards 1 | tail -n +2 | wc -l | tr -d ' ')" = "2"
          HOME="$rich_home" ./zig-out/bin/deez nut export 1 > /tmp/geography.nut
          grep -q '"note_type":"basic-reverse"' /tmp/geography.nut

          rich_import_home=$(mktemp -d)
          HOME="$rich_import_home" ./zig-out/bin/deez nut import /tmp/geography.nut </dev/null
          HOME="$rich_import_home" ./zig-out/bin/deez notes 1 | grep -q "basic-reverse"
          test "$(HOME="$rich_import_home" ./zig-out/bin/deez cards 1 | tail -n +2 | wc -l | tr -d ' ')" = "2"

          media_home=$(mktemp -d)
          printf 'deez-test-image-bytes' > /tmp/deez-diagram.png
          media_ref=$(HOME="$media_home" ./zig-out/bin/deez media add /tmp/deez-diagram.png | head -n 1)
          echo "$media_ref" | grep -Eq '^deez-media://sha256:[0-9a-f]{64}$'
          media_hash=${media_ref#deez-media://sha256:}
          test -f "$media_home/.local/share/deez/media/sha256/${media_hash:0:2}/$media_hash"
          test -f "$media_home/.local/share/deez/media/sha256/${media_hash:0:2}/$media_hash.json"

          HOME="$media_home" ./zig-out/bin/deez deck add "Rich Media" </dev/null
          HOME="$media_home" ./zig-out/bin/deez note add 1 basic "What is pictured?" "<img src=\"$media_ref\">"
          HOME="$media_home" ./zig-out/bin/deez sack export 1 /tmp/rich-media.sack
          test -s /tmp/rich-media.sack
          unzip -l /tmp/rich-media.sack | grep -q 'manifest.json'
          unzip -l /tmp/rich-media.sack | grep -q 'deck.nut'
          unzip -l /tmp/rich-media.sack | grep -q "media/sha256/$media_hash"

          media_import_home=$(mktemp -d)
          HOME="$media_import_home" ./zig-out/bin/deez sack import /tmp/rich-media.sack </dev/null
          HOME="$media_import_home" ./zig-out/bin/deez decks | grep -q "Rich Media"
          HOME="$media_import_home" ./zig-out/bin/deez notes 1 | grep -q "What is pictured?"
          test -f "$media_import_home/.local/share/deez/media/sha256/${media_hash:0:2}/$media_hash"
      - name: Test
        run: zig build test
      - name: Benchmark context
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "zig=$(zig version)"
          uname -a
          lscpu
          free -h
      - name: Benchmark smoke and median baseline
        run: |
          zig build benchmark -Doptimize=ReleaseFast >/tmp/deez-bench-warmup.txt
          for run in 1 2 3 4 5; do
            zig build benchmark -Doptimize=ReleaseFast >"/tmp/deez-bench-${run}.txt"
            cat "/tmp/deez-bench-${run}.txt"
          done

          median() {
            key="$1"
            value=$(grep "^${key}=" /tmp/deez-bench-[1-5].txt | awk -F'[= ]' '{print $2}' | sort -n | sed -n '3p')
            test -n "$value"
            echo "median_${key}=${value}"
          }

          median schedule_100_long_history_ns
          median replay_100x_1000_reviews_ns
          median optimize_79_examples_1_epoch_ns
          median archive_dry_run_100x_1000_cards_ns

  macos-release-smoke:
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build native release binary
        run: zig build -Doptimize=ReleaseFast
      - name: Run release binary
        run: ./zig-out/bin/deez --help >/dev/null
