name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format
        run: zig fmt --check build.zig src test
      - name: Build
        run: zig build
      - name: First-run and JSON deck smoke
        shell: bash
        run: |
          set -euo pipefail

          first_home=$(mktemp -d)
          HOME="$first_home" ./zig-out/bin/deez --help >/dev/null
          test ! -e "$first_home/.config/deez/config"

          HOME="$first_home" ./zig-out/bin/deez decks </dev/null
          test -f "$first_home/.local/share/deez/deez.db"
          test -f "$first_home/.config/deez/config"
          test "$(head -n 1 "$first_home/.config/deez/config")" = "sqlite"

          HOME="$first_home" ./zig-out/bin/deez deck add "Zig Basics"
          HOME="$first_home" ./zig-out/bin/deez card add 1 "What is Zig?" "A systems programming language"
          HOME="$first_home" ./zig-out/bin/deez deck export 1 > /tmp/zig-basics.json
          grep -q '"format": "deez.deck"' /tmp/zig-basics.json
          grep -q '"name": "Zig Basics"' /tmp/zig-basics.json

          second_home=$(mktemp -d)
          HOME="$second_home" ./zig-out/bin/deez deck import /tmp/zig-basics.json </dev/null
          HOME="$second_home" ./zig-out/bin/deez decks | grep -q "Zig Basics"
          HOME="$second_home" ./zig-out/bin/deez cards 1 | grep -q "What is Zig?"
      - name: Test
        run: zig build test
      - name: Benchmark context
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "zig=$(zig version)"
          uname -a
          lscpu
          free -h
      - name: Benchmark smoke and median baseline
        run: |
          zig build benchmark -Doptimize=ReleaseFast >/tmp/deez-bench-warmup.txt
          for run in 1 2 3 4 5; do
            zig build benchmark -Doptimize=ReleaseFast >"/tmp/deez-bench-${run}.txt"
            cat "/tmp/deez-bench-${run}.txt"
          done

          median() {
            key="$1"
            value=$(grep "^${key}=" /tmp/deez-bench-[1-5].txt | awk -F'[= ]' '{print $2}' | sort -n | sed -n '3p')
            test -n "$value"
            echo "median_${key}=${value}"
          }

          median schedule_100_long_history_ns
          median replay_100x_1000_reviews_ns
          median optimize_79_examples_1_epoch_ns
          median archive_dry_run_100x_1000_cards_ns

  macos-release-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and run Apple Silicon release binary
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          ./zig-out/bin/deez --help >/dev/null
      - name: Cross-build Intel release binary
        run: |
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
