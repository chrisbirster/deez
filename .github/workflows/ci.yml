name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format
        run: zig fmt --check build.zig src test
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Benchmark context
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "zig=$(zig version)"
          uname -a
          lscpu
          free -h
      - name: Benchmark smoke
        run: zig build benchmark -Doptimize=ReleaseFast
