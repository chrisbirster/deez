name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format
        run: zig fmt --check build.zig src test
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Benchmark context
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "zig=$(zig version)"
          uname -a
          lscpu
          free -h
      - name: Benchmark smoke and median baseline
        run: |
          zig build benchmark -Doptimize=ReleaseFast >/tmp/deez-bench-warmup.txt
          for run in 1 2 3 4 5; do
            zig build benchmark -Doptimize=ReleaseFast >"/tmp/deez-bench-${run}.txt"
            cat "/tmp/deez-bench-${run}.txt"
          done

          median() {
            key="$1"
            value=$(grep "^${key}=" /tmp/deez-bench-[1-5].txt | awk -F'[= ]' '{print $2}' | sort -n | sed -n '3p')
            test -n "$value"
            echo "median_${key}=${value}"
          }

          median schedule_100_long_history_ns
          median replay_100x_1000_reviews_ns
          median optimize_79_examples_1_epoch_ns
          median archive_dry_run_100x_1000_cards_ns
