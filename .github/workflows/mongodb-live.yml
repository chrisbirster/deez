name: MongoDB backend

on:
  push:
  pull_request:

jobs:
  mongo-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deez
      - uses: actions/checkout@v4
        with:
          repository: chrisbirster/bongo
          ref: 631bb812777af587162daa650b53f48196960d55
          path: bongo-fixture
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Start MongoDB replica set
        run: bash ./bongo-fixture/scripts/start-replica-db.sh
      - name: Test MongoStore against pinned Bongo 0.3.0 package
        working-directory: deez
        run: zig build mongo-integration-test
      - name: Stop MongoDB fixture
        if: always()
        run: docker rm -f mongodb-rs >/dev/null 2>&1 || true
