name: MongoDB backend

on:
  push:
  pull_request:

jobs:
  mongo-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deez
      - uses: actions/checkout@v4
        with:
          repository: chrisbirster/bongo
          ref: bongo-deez-readiness
          path: bongo
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Start MongoDB replica set
        run: bash ./bongo/scripts/start-replica-db.sh
      - name: Test MongoStore
        working-directory: deez
        run: zig build mongo-integration-test
      - name: Stop MongoDB fixture
        if: always()
        run: docker rm -f mongodb-rs >/dev/null 2>&1 || true
