name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve milestone release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            SHOULD_RELEASE=true
          else
            test -f VERSION
            VERSION=$(tr -d '[:space:]' < VERSION)
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid VERSION: $VERSION" >&2
              exit 1
            fi
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              SHOULD_RELEASE=false
            else
              SHOULD_RELEASE=true
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG} should_release=${SHOULD_RELEASE}"

  web-assets:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned compiled Deez Web bundle
        shell: bash
        run: |
          set -euo pipefail
          cat release/deez-web-dist/part-*.b64 | base64 --decode > /tmp/deez-web-dist.zip
          test "$(stat -c '%s' /tmp/deez-web-dist.zip)" = "54131"
          echo '148ecaca204ffc0633447c6fba5c01f896b863a2f1cd0a19af15d8bbc47a75ea  /tmp/deez-web-dist.zip' | sha256sum --check
          unzip -t /tmp/deez-web-dist.zip
          mkdir -p dist/web
          unzip -q /tmp/deez-web-dist.zip -d dist/web
          test -f dist/web/index.html
          test -d dist/web/assets
          grep -q '<title>Deez</title>' dist/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: deez-web-dist
          path: dist/web
          if-no-files-found: error

  build-macos:
    needs:
      - prepare
      - web-assets
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            archive: deez-aarch64-apple-darwin.tar.gz
          - runner: macos-15-intel
            archive: deez-x86_64-apple-darwin.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build native release binary
        run: zig build -Doptimize=ReleaseFast
      - name: Smoke test binary
        run: ./zig-out/bin/deez --help >/dev/null
      - name: Assemble portable package
        shell: bash
        run: |
          mkdir -p dist/package
          cp zig-out/bin/deez dist/package/deez
      - name: Download Deez Web bundle
        uses: actions/download-artifact@v4
        with:
          name: deez-web-dist
          path: dist/package/web
      - name: Smoke test packaged Deez Web
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/package/web/index.html
          test -d dist/package/web/assets

          tmp=$(mktemp -d)
          port=49321
          web_pid=""
          cleanup() {
            if [[ -n "$web_pid" ]]; then
              kill "$web_pid" >/dev/null 2>&1 || true
              wait "$web_pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          DEEZ_STORAGE=sqlite DEEZ_DB="$tmp/deez.db" ./dist/package/deez web --port "$port" >"$tmp/web.log" 2>&1 &
          web_pid=$!
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:${port}/" >"$tmp/index.html" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$tmp/web.log" >&2
            exit 1
          fi
          grep -q '<title>Deez</title>' "$tmp/index.html"
          curl -fsS "http://127.0.0.1:${port}/decks/1" | grep -q '<title>Deez</title>'
          grep -q 'assets:' "$tmp/web.log"
      - name: Package binary and web assets
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: tar -C dist/package -czf "dist/${ARCHIVE}" deez web
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-macos
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: deez-*-apple-darwin.tar.gz
          path: dist
          merge-multiple: true

      - name: Checksums
        id: checksums
        shell: bash
        run: |
          ARM_SHA=$(sha256sum dist/deez-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          INTEL_SHA=$(sha256sum dist/deez-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          echo "arm_sha=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "intel_sha=${INTEL_SHA}" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$ARM_SHA" deez-aarch64-apple-darwin.tar.gz > dist/SHA256SUMS
          printf '%s  %s\n' "$INTEL_SHA" deez-x86_64-apple-darwin.tar.gz >> dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create release tag from main
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Deez ${TAG}"
          git push origin "$TAG"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            dist/deez-aarch64-apple-darwin.tar.gz
            dist/deez-x86_64-apple-darwin.tar.gz
            dist/SHA256SUMS

      - name: Update Homebrew formula on main
        shell: bash
        env:
          ARM_SHA: ${{ steps.checksums.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.checksums.outputs.intel_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main
          mkdir -p Formula
          cat > Formula/deez.rb <<EOF
          class Deez < Formula
            desc "Terminal-first spaced-repetition system using FSRS"
            homepage "https://github.com/chrisbirster/deez"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "https://github.com/chrisbirster/deez/releases/download/${TAG}/deez-aarch64-apple-darwin.tar.gz"
              sha256 "${ARM_SHA}"
            end

            on_intel do
              url "https://github.com/chrisbirster/deez/releases/download/${TAG}/deez-x86_64-apple-darwin.tar.gz"
              sha256 "${INTEL_SHA}"
            end

            depends_on :macos

            def install
              bin.install "deez"
              (share/"deez").install "web"
            end

            test do
              assert_match "DEEZ", shell_output("#{bin}/deez --help")
              assert_match "--web-root", shell_output("#{bin}/deez web --help")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/deez.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Homebrew formula for ${TAG}"
          git push origin main

  homebrew-consumption:
    needs:
      - prepare
      - publish
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/homebrew-smoke.yml
