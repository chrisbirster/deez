name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-binaries:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Apple Silicon binary
        run: |
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          mkdir -p dist/deez-aarch64-apple-darwin
          cp zig-out/bin/deez dist/deez-aarch64-apple-darwin/deez
          dist/deez-aarch64-apple-darwin/deez --help >/dev/null
          tar -C dist/deez-aarch64-apple-darwin -czf dist/deez-aarch64-apple-darwin.tar.gz deez

      - name: Build Intel binary
        run: |
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          mkdir -p dist/deez-x86_64-apple-darwin
          cp zig-out/bin/deez dist/deez-x86_64-apple-darwin/deez
          tar -C dist/deez-x86_64-apple-darwin -czf dist/deez-x86_64-apple-darwin.tar.gz deez

      - name: Checksums
        id: checksums
        shell: bash
        run: |
          ARM_SHA=$(shasum -a 256 dist/deez-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 dist/deez-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          echo "arm_sha=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "intel_sha=${INTEL_SHA}" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$ARM_SHA" deez-aarch64-apple-darwin.tar.gz > dist/SHA256SUMS
          printf '%s  %s\n' "$INTEL_SHA" deez-x86_64-apple-darwin.tar.gz >> dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/deez-aarch64-apple-darwin.tar.gz
            dist/deez-x86_64-apple-darwin.tar.gz
            dist/SHA256SUMS

      - name: Update Homebrew formula on main
        shell: bash
        env:
          ARM_SHA: ${{ steps.checksums.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.checksums.outputs.intel_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          git fetch origin main
          git checkout main
          mkdir -p Formula
          cat > Formula/deez.rb <<EOF
          class Deez < Formula
            desc "Terminal-first spaced-repetition system using FSRS"
            homepage "https://github.com/chrisbirster/deez"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "https://github.com/chrisbirster/deez/releases/download/${TAG}/deez-aarch64-apple-darwin.tar.gz"
              sha256 "${ARM_SHA}"
            end

            on_intel do
              url "https://github.com/chrisbirster/deez/releases/download/${TAG}/deez-x86_64-apple-darwin.tar.gz"
              sha256 "${INTEL_SHA}"
            end

            depends_on :macos

            def install
              bin.install "deez"
            end

            test do
              assert_match "DEEZ", shell_output("#{bin}/deez --help")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/deez.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Homebrew formula for ${TAG}"
          git push origin main
