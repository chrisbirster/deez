name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-binaries:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Apple Silicon binary
        run: |
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          mkdir -p dist/deez-aarch64-apple-darwin
          cp zig-out/bin/deez dist/deez-aarch64-apple-darwin/deez
          tar -C dist/deez-aarch64-apple-darwin -czf dist/deez-aarch64-apple-darwin.tar.gz deez

      - name: Build Intel binary
        run: |
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          mkdir -p dist/deez-x86_64-apple-darwin
          cp zig-out/bin/deez dist/deez-x86_64-apple-darwin/deez
          tar -C dist/deez-x86_64-apple-darwin -czf dist/deez-x86_64-apple-darwin.tar.gz deez

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 deez-aarch64-apple-darwin.tar.gz deez-x86_64-apple-darwin.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/deez-aarch64-apple-darwin.tar.gz
            dist/deez-x86_64-apple-darwin.tar.gz
            dist/SHA256SUMS
